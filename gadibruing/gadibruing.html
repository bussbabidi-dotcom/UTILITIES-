<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f1ec">
  <title>gadibruing</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --ink: #2c2926;
      --muted: #6f6a64;
      --slot: #e7e2db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 2.5rem, 26rem);
      margin: 0 auto;
      padding: max(3.25rem, env(safe-area-inset-top)) 0 max(3.5rem, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 0;
      font-weight: 560;
      font-size: clamp(2.75rem, 14vw, 4.25rem);
      letter-spacing: -0.045em;
      line-height: 0.92;
    }
    .frase {
      margin: 1rem 0 2.25rem;
      max-width: 18rem;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.45;
    }
    .fotos {
      display: grid;
      gap: 0.85rem;
    }
    figure {
      margin: 0;
      aspect-ratio: 4 / 5;
      border-radius: 1.35rem;
      background: var(--slot);
      overflow: hidden;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @media (min-width: 800px) {
      main { width: min(100% - 4rem, 44rem); padding-top: 4.5rem; }
      .fotos { grid-template-columns: 1fr 1fr; gap: 1rem; }
      .frase { max-width: 22rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>gadibruing</h1>
    <!-- FRASE: troque só o texto abaixo -->
    <p class="frase">aqui é só nosso.</p>
    <!--
      FOTOS: este arquivo abre sozinho no celular, sem pasta.
      Para colocar uma foto, troque um <figure></figure> por:
      <figure><img alt="" src="data:image/jpeg;base64,COLE_AQUI"></figure>
    -->
    <div class="fotos">
      <figure></figure>
      <figure></figure>
      <figure></figure>
      <figure></figure>
      <figure></figure>
      <figure></figure>
    </div>
  </main>
</body>
</html>
